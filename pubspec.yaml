name: pokedex_app
description: A Pokedex Flutter application
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  http: ^1.1.2
  dio: ^5.3.4

  cached_network_image: ^3.3.1

  get_it: ^7.6.7

  go_router: ^12.1.3

  intl: ^0.18.1

  hive_flutter: ^1.1.0

  dartz: ^0.10.1

  json_annotation: ^4.8.1
  riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  freezed_annotation: ^3.1.0
  flutter_popup: ^3.3.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1

  mocktail: ^1.0.1
  bloc_test: ^9.1.5

  flutter_lints: ^3.0.1

  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon_app.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
